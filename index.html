<!DOCTYPE html>
<html>

<head>
    <title>My English library</title>

    <!-- CSS: Change how the app looks -->
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        button {
            font-size: 30px;
            padding: 20px;
            margin: 12px;
            background-color: lightpink;
        }
    </style>
</head>

<body>

    <!-- HTML: Change what learners see -->

    <h1>Vocabulary Quiz</h1>

    <p>What does "look forward to" mean?</p>

    <button onclick="checkAnswer('expect')">
        Expect
    </button>

    <button onclick="checkAnswer('sleep')">
        Sleep
    </button>

    <button onclick="checkAnswer('watch')">
        Watch
    </button>

    <h3 id="feedback"></h3>


    <!-- JavaScript: Change what happens -->

    <script>

        function checkAnswer(answer) {

            if (answer === "expect") {
                document.getElementById("feedback").innerText =
                    "맞췄어! 잘했어!";
            }

            else {
                document.getElementById("feedback").innerText =
                    "틀렸어. 그 답은 Expect야.";
            }

        }

    </script>

</body>
</html>
