<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Accent Player</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    .app {
      width: min(760px, 100%);
      background: white;
      padding: 28px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      margin-bottom: 24px;
      text-align: center;
      color: #6b7280;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      padding: 16px;
      resize: vertical;
      border: 2px solid #dbe2ea;
      border-radius: 14px;
      outline: none;
      font-size: 18px;
      line-height: 1.5;
      font-family: Arial, sans-serif;
    }

    textarea:focus {
      border-color: #6366f1;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 15px 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(0.97);
    }

    .american {
      background: #eef2ff;
      color: #3730a3;
    }

    .british {
      background: #fef2f2;
      color: #991b1b;
    }

    .stop {
      width: 100%;
      margin-top: 12px;
      background: #f3f4f6;
      color: #374151;
    }

    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    label {
      color: #6b7280;
      font-size: 14px;
      display: block;
    }

    select {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      border: 1px solid #dbe2ea;
      border-radius: 10px;
      background: white;
      font-size: 14px;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #f8fafc;
      text-align: center;
      color: #64748b;
      font-size: 14px;
      font-weight: 600;
    }

    @media (max-width: 520px) {
      .button-grid,
      .settings {
        grid-template-columns: 1fr;
      }

      .app {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

<main class="app">
  <h1>🇺🇸 🇬🇧 English Accent Player</h1>
  <div class="subtitle">
    영어 문장을 입력하고 다양한 발음 및 속도로 들어보세요.
  </div>

  <textarea id="text" placeholder="Type an English sentence here...">How are you doing today?</textarea>

  <div class="button-grid">
    <button class="american" onclick="speak('american')">
      🇺🇸 American Accent
    </button>
    <button class="british" onclick="speak('british')">
      🇬🇧 British Accent
    </button>
  </div>

  <button class="stop" onclick="stopSpeaking()">
    ⏹ Stop
  </button>

  <div class="settings">
    <label>
      Speed
      <select id="speed">
        <option value="0.7">0.7× Slow</option>
        <option value="0.85">0.85×</option>
        <option value="1" selected>1.0× Normal</option>
        <option value="1.15">1.15×</option>
        <option value="1.3">1.3× Fast</option>
