<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Accent Player</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    .app {
      width: min(760px, 100%);
      background: white;
      padding: 28px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      margin-bottom: 24px;
      text-align: center;
      color: #6b7280;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      padding: 16px;
      resize: vertical;
      border: 2px solid #dbe2ea;
      border-radius: 14px;
      outline: none;
      font-size: 18px;
      line-height: 1.5;
      font-family: Arial, sans-serif;
    }

    textarea:focus {
      border-color: #6366f1;
    }

    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 15px 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(0.97);
    }

    .american {
      background: #eef2ff;
      color: #3730a3;
    }

    .british {
      background: #fef2f2;
      color: #991b1b;
    }

    .stop {
      width: 100%;
      margin-top: 12px;
      background: #f3f4f6;
      color: #374151;
    }

    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    label {
      color: #6b7280;
      font-size: 14px;
      display: block;
    }

    select {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      border: 1px solid #dbe2ea;
      border-radius: 10px;
      background: white;
      font-size: 14px;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #f8fafc;
      text-align: center;
      color: #64748b;
      font-size: 14px;
      font-weight: 600;
    }

    @media (max-width: 520px) {
      .button-grid,
      .settings {
        grid-template-columns: 1fr;
      }

      .app {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

<main class="app">
  <h1>🇺🇸 🇬🇧 English Accent Player</h1>
  <div class="subtitle">
    영어 문장을 입력하고 다양한 발음 및 속도로 들어보세요.
  </div>

  <textarea id="text" placeholder="Type an English sentence here...">How are you doing today?</textarea>

  <div class="button-grid">
    <button class="american" onclick="speak('american')">
      🇺🇸 American Accent
    </button>
    <button class="british" onclick="speak('british')">
      🇬🇧 British Accent
    </button>
  </div>

  <button class="stop" onclick="stopSpeaking()">
    ⏹ Stop
  </button>

  <div class="settings">
    <label>
      Speed
      <select id="speed">
        <option value="0.7">0.7× Slow</option>
        <option value="0.85">0.85×</option>
        <option value="1" selected>1.0× Normal</option>
        <option value="1.15">1.15×</option>
        <option value="1.3">1.3× Fast</option>
      </select>
    </label>

    <label>
      Pitch
      <select id="pitch">
        <option value="0.8">Low</option>
        <option value="1" selected>Normal</option>
        <option value="1.2">High</option>
      </select>
    </label>
  </div>

  <div id="status" class="status">Ready</div>
</main>

<script>
  let voices = [];

  function loadVoices() {
    voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  }

  loadVoices();
  if (typeof speechSynthesis !== "undefined" && "onvoiceschanged" in speechSynthesis) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function findVoice(type) {
    const targetLanguage = type === "american" ? "en-US" : "en-GB";
    let voice = voices.find(v => v.lang === targetLanguage);
    if (voice) return voice;

    const region = type === "american" ? "en-us" : "en-gb";
    voice = voices.find(v => v.lang.toLowerCase() === region);
    if (voice) return voice;

    return voices.find(v => v.lang.toLowerCase().startsWith("en"));
  }

  function speak(type) {
    const text = document.getElementById("text").value.trim();
    const status = document.getElementById("status");

    if (!text) {
      status.textContent = "문장을 먼저 입력해주세요.";
      return;
    }

    if (!('speechSynthesis' in window)) {
      status.textContent = "현재 브라우저는 음성합성(TTS)을 지원하지 않습니다.";
      return;
    }

    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    const voice = findVoice(type);

    utterance.lang = type === "american" ? "en-US" : "en-GB";
    utterance.rate = Number(document.getElementById("speed").value);
    utterance.pitch = Number(document.getElementById("pitch").value);

    if (voice) {
      utterance.voice = voice;
      status.textContent = type === "american"
        ? "🇺🇸 미국식 발음으로 재생 중..."
        : "🇬🇧 영국식 발음으로 재생 중...";
    } else {
      status.textContent = "해당 지역 음성을 찾지 못해 기본 영어 음성으로 재생합니다.";
    }

    utterance.onend = function () {
      status.textContent = "재생이 완료되었습니다.";
    };

    utterance.onerror = function () {
      status.textContent = "재생 중 오류가 발생했습니다.";
    };

    speechSynthesis.speak(utterance);
  }

  function stopSpeaking() {
    if ('speechSynthesis' in window) {
      speechSynthesis.cancel();
    }
    document.getElementById("status").textContent = "정지되었습니다.";
  }
</script>

</body>
</html>
